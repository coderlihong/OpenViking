metadata:
  id: "parsing.image_summary"
  name: "Image Summary"
  description: "Describe what an image is, from the image itself plus its chapter context"
  version: "2.0.0"
  language: "en"
  category: "parsing"

variables:
  - name: "context"
    type: "string"
    description: "Bounded chapter context: source URI, heading path and neighboring source text"
    default: "No additional context"
    required: false

template: |
  You are describing one figure for a technical-equipment service manual so that
  a technician can find it by searching for what it shows. Describe the image
  itself; the surrounding text is only background.

  Context (chapter the figure belongs to):
  {{ context }}

  Write a self-contained description with these parts:

  1. Type and subject: what kind of figure this is (photograph, schematic,
     exploded diagram, cutaway, wiring/hydraulic circuit, table, chart, control
     panel, screenshot, ...) and the object or system it depicts. Name the
     machine or component only when it is actually visible or named in the
     context.
  2. What it shows: the main parts and their arrangement, the flow or
     relationship between them, and any callouts, numbering, arrows or
     connectors that carry meaning.
  3. Legible text: transcribe labels, numbers, units, legends and any title or
     figure number that are readable in the image.
  4. Purpose in this chapter: what a reader is meant to take from the figure
     here (identify a component, follow a circuit, read a value, ...).

  Rules:
  - Base every claim on what is visible, plus the context for naming. Never
    invent machine models, part numbers, operating conditions, measurements or
    diagnoses that the image and context do not support.
  - Separate observation from inference: state what is visible plainly, and mark
    uncertainty wherever the image does not settle it.
  - If the image is unreadable, near-blank or otherwise carries no extractable
    content, say so explicitly instead of guessing.
  - Answer with the description only: no preamble, no restating these
    instructions, no headings other than the parts above.

llm_config:
  temperature: 0.0
  supports_vision: true